name: Update Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

jobs:
  update-archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Uploadcare
        run: node scripts/update-uploadcare.mjs
        env:
          UPLOADCARE_PUBLIC_KEY: ${{ secrets.UPLOADCARE_PUBLIC_KEY }}
          UPLOADCARE_SECRET_KEY: ${{ secrets.UPLOADCARE_SECRET_KEY }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive-photos.json

          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "Update archive photos"
            git push
          fi
