<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>kysolace — Archive</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <nav>
    <a href="index.html">kysolace</a> <a href="music.html">Music</a>
    <a href="archive.html" class="active">Archive</a>
    <a href="ideas.html">Ideas</a>
  </nav>
</header>

<main>

<section class="archive">

  <div class="grid" id="archive-grid"></div>

</section>

</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-image" src="" alt="">
</div>

<script>
async function loadArchive() {
  const grid = document.getElementById("archive-grid");

  try {
    const response = await fetch("archive-photos.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Could not load archive-photos.json");
    }

    const photos = await response.json();

    photos.forEach(photo => {
      const article = document.createElement("article");
      article.className = "tile";

      const image = document.createElement("img");
      image.src = photo.image;
      image.alt = photo.alt || "";
      image.loading = "lazy";
      image.onclick = () => openLightbox(photo.image);

      article.appendChild(image);
      grid.appendChild(article);
    });

  } catch (error) {
    console.error("Archive failed to load:", error);
  }
}

function openLightbox(src) {
  const lightbox = document.getElementById("lightbox");
  const image = document.getElementById("lightbox-image");

  image.src = src;
  lightbox.classList.add("active");
  document.body.classList.add("lightbox-open");
}

function closeLightbox() {
  const lightbox = document.getElementById("lightbox");
  const image = document.getElementById("lightbox-image");

  lightbox.classList.remove("active");
  document.body.classList.remove("lightbox-open");
  image.src = "";
}

loadArchive();
</script>

</body>
</html>
