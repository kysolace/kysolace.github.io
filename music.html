<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <title>kysolace — Music</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f5f5f0;
  color: #111;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
  line-height: 1.35;
}

body {
  min-height: 100vh;
  padding-bottom: 90px;
}


/* HEADER */

.site-header {
  position: fixed;
  z-index: 10;
  top: 0;
  left: 0;
  width: 100%;
  padding: 15px 18px;
  background: #f5f5f0;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0 18px;
}

nav a {
  color: #111;
  text-decoration: none;
  white-space: nowrap;
}

nav a:hover,
nav a.active {
  text-decoration: none !important;
}


/* PAGE */

.audio-page {
  width: 100%;
  padding: 67px 18px 50px;
}


/* TRACK GRID */

.project {
  width: 100%;
  max-width: 100%;
}

.tracklist {
  display: grid;
  width: 100%;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 30px 12px;
}


/* TRACK CARD */

.track {
  min-width: 0;
  display: grid;
  grid-template-rows: auto auto auto;
  align-content: start;
  border: 0;
  transition: none;
}


/* TRACK PLAY AREA */

.track-main {
  min-width: 0;
}

.track-play {
  appearance: none;
  border: 0;
  background: transparent;
  width: 100%;
  aspect-ratio: 4 / 3;
  padding: 0;
  margin: 0;
  color: #111;
  font-family: Arial, Helvetica, sans-serif;
  cursor: default;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.track-play:hover {
  opacity: 1;
}

.track-play .play-icon {
  width: 44px;
  height: 50px;
  margin: 0;
  position: relative;
  background: transparent;
  clip-path: none;
  pointer-events: auto;
  cursor: pointer;
}

.track-play .play-icon::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 28px;
  height: 34px;
  transform: translate(-50%, -50%);
  background: currentColor;
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}

.track-play .play-icon:hover {
  opacity: .5;
}

.track-play .play-icon.is-playing::before {
  background: linear-gradient(
    to right,
    currentColor 0 9px,
    transparent 9px 19px,
    currentColor 19px 28px
  );
  clip-path: none;
}


/* TRACK CONTROLS */

.track-controls {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 38px;
  align-items: center;
  gap: 7px;
  margin-top: 12px;
}


/* CSS-DRAWN PLAY / PAUSE ICONS */

.play-icon,
.play-symbol {
  display: block;
  width: 9px;
  height: 11px;
  margin: 0 auto;
  background: currentColor;
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}

.play-icon.is-playing,
.main-play.is-playing .play-symbol {
  width: 9px;
  height: 11px;
  background: linear-gradient(
    to right,
    currentColor 0 3px,
    transparent 3px 6px,
    currentColor 6px 9px
  );
  clip-path: none;
}

.main-play .play-symbol {
  position: relative;
}


.track-progress {
  width: 100%;
  height: 2px;
  background: #deded9;
  cursor: pointer;
}

.track-progress-fill {
  width: 0;
  height: 100%;
  background: #111;
}

.track-duration {
  text-align: right;
  font-size: 9px;
  color: #777;
  white-space: nowrap;
}


/* TRACK INFO */

.track-info {
  min-width: 0;
  margin-top: 8px;
  text-align: center;
}

.track-title {
  font-size: 11px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-release {
  margin-top: 3px;
  font-size: 9px;
  color: #777;
  white-space: nowrap;
}

.track.playing .track-title {
  text-decoration: none !important;
}

/* Hide the small pause glyph; keep the main track control intact */
.track.playing .play-icon {
  visibility: hidden;
}


/* HIDE NATIVE AUDIO */

.track audio {
  display: none;
}


/* BOTTOM PLAYER */

.player {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  z-index: 20;
  background: #f5f5f0;
  border-top: 1px solid #d8d8d3;
}

.player-inner {
  display: grid;

  grid-template-columns:
    1fr
    auto
    1fr;

  align-items: center;

  gap: 25px;

  padding: 11px 18px;
}


/* PLAYER TRACK */

.player-track {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.player-number {
  color: #888;
  font-size: 9px;
}

.player-title {
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* PLAYER CONTROLS */

.player-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.player-controls button {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 0;
  color: #111;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  cursor: pointer;
}

.player-controls button:hover {
  opacity: .5;
}

.player-controls .main-play {
  width: 28px;
  height: 28px;
  font-size: 10px;
  border: 1px solid #111;
  border-radius: 50%;
}


/* PLAYER TIME */

.player-time {
  display: grid;

  grid-template-columns:
    32px
    minmax(60px, 1fr)
    32px;

  align-items: center;

  gap: 7px;

  font-size: 8px;

  color: #777;
}

.player-time > span:last-child {
  text-align: right;
}


/* PLAYER PROGRESS */

.player-progress {
  width: 100%;
  height: 2px;
  background: #deded9;
  cursor: pointer;
}

.player-progress-fill {
  width: 0;
  height: 100%;
  background: #111;
}


/* TABLET */

@media (max-width: 800px) {

  .audio-page {
    padding-top: 62px;
  }

  .tracklist {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 26px 9px;
  }

}


/* PHONE */

@media (max-width: 480px) {

  body {
    padding-bottom: 116px;
  }

  .audio-page {
    padding: 62px 12px 35px;
  }

  .tracklist {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px 8px;
  }

  .track-controls {
    grid-template-columns: minmax(0, 1fr) 34px;
    gap: 5px;
    margin-top: 10px;
  }

  .track-title {
    font-size: 10px;
  }

  .track-release,
  .track-duration {
    font-size: 8px;
  }


  /* MOBILE PLAYER */

  .player-inner {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    padding: 10px 12px;
  }

  .player-track {
    min-width: 0;
  }

  .player-controls {
    grid-column: 2;
    grid-row: 1;
    gap: 11px;
  }

  .player-controls button {
    font-size: 14px;
  }

  .player-controls .main-play {
    width: 27px;
    height: 27px;
  }

  .player-time {
    grid-column: 1 / -1;
    grid-row: 2;
  }

}


/* VERY SMALL PHONES */

@media (max-width: 380px) {

  .tracklist {
    gap: 20px 7px;
  }

  .track-controls {
    grid-template-columns: minmax(0, 1fr) 32px;
  }

}


/* SOUNDCLOUD BACKEND */

.soundcloud-host {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}

.soundcloud-host iframe {
  width: 1px;
  height: 1px;
  border: 0;
}

.track-play:disabled {
  opacity: .35;
  cursor: not-allowed;
}


/* NO UNDERLINES OR BLUE LINKS */
a,
a:link,
a:visited,
a:hover,
a:active,
a:focus,
nav a,
nav a:link,
nav a:visited,
nav a:hover,
nav a:active,
nav a:focus,
nav a.active {
  color: #111 !important;
  text-decoration: none !important;
}

.track.playing .track-title {
  text-decoration: none !important;
}

</style>

<script src="https://w.soundcloud.com/player/api.js"></script>

</head>

<body>

  <header class="site-header">
    <nav>
      <a href="index.html">kysolace</a>
      <a href="music.html" class="active">Music</a>
      <a href="archive.html">Archive</a>
      <a href="ideas.html">Ideas</a>
    </nav>
  </header>


  <main class="audio-page">

    <section class="project">

      <div
        class="tracklist"
        id="tracklist"
        aria-live="polite">
      </div>

    </section>

  </main>


  <!-- BOTTOM PLAYER -->

  <div class="player">

    <div class="player-inner">

      <div class="player-track">

        <span
          class="player-number"
          id="player-number">
          01
        </span>

        <div
          class="player-title"
          id="player-title">
          —
        </div>

      </div>


      <div class="player-controls">

        <button
          id="prev"
          type="button"
          aria-label="Previous track">
          ‹
        </button>

        <button
          id="main-play"
          class="main-play"
          type="button"
          aria-label="Play">

          <span
            class="play-symbol"
            aria-hidden="true">
          </span>

        </button>

        <button
          id="next"
          type="button"
          aria-label="Next track">
          ›
        </button>

      </div>


      <div class="player-time">

        <span id="current-time">
          0:00
        </span>

        <div
          class="player-progress"
          id="player-progress"
          role="slider"
          aria-label="Seek"
          tabindex="0">

          <div
            class="player-progress-fill"
            id="player-progress-fill">
          </div>

        </div>

        <span id="total-time">
          0:00
        </span>

      </div>

    </div>

  </div>


<script>

/*
  Automatic SoundCloud mirror
  ----------------------------

  This page does NOT contain individual track links.

  GitHub Actions should generate
  soundcloud-tracks.json from your
  public SoundCloud profile.

  This page then renders that file.
*/


const DATA_URL = "soundcloud-tracks.json";


const tracklist =
  document.getElementById("tracklist");

const mainPlay =
  document.getElementById("main-play");

const prev =
  document.getElementById("prev");

const next =
  document.getElementById("next");

const playerNumber =
  document.getElementById("player-number");

const playerTitle =
  document.getElementById("player-title");

const currentTime =
  document.getElementById("current-time");

const totalTime =
  document.getElementById("total-time");

const playerProgress =
  document.getElementById("player-progress");

const playerProgressFill =
  document.getElementById("player-progress-fill");


let tracks = [];
let widgets = [];
let widgetReady = [];
let durations = [];

let currentTrack = null;
let currentIndex = -1;



function formatTime(ms) {

  if (!Number.isFinite(ms) || ms <= 0)
    return "—";

  const totalSeconds =
    Math.floor(ms / 1000);

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    String(totalSeconds % 60)
      .padStart(2, "0");

  return `${minutes}:${seconds}`;
}



function formatReleaseDate(value) {

  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime()))
    return "";

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  const year =
    String(date.getFullYear())
      .slice(-2);

  return `${month}.${day}.${year}`;
}



function setProgress(track, percent) {

  const fill =
    track.querySelector(
      ".track-progress-fill"
    );

  if (fill)
    fill.style.width =
      `${Math.max(
        0,
        Math.min(100, percent)
      )}%`;
}



function resetTrack(track) {

  if (!track) return;

  track.classList.remove("playing");

  const icon =
    track.querySelector(".play-icon");

  if (icon)
    icon.className = "play-icon";

  setProgress(track, 0);
}



function updatePlayer(track, index) {

  currentTrack = track;
  currentIndex = index;

  playerNumber.textContent =
    String(index + 1)
      .padStart(2, "0");

  playerTitle.textContent =
    track.querySelector(
      ".track-name"
    )?.textContent || "—";

  currentTime.textContent =
    "0:00";

  totalTime.textContent =
    formatTime(durations[index]);

  playerProgressFill.style.width =
    "0%";
}



function loadTrack(
  index,
  autoplay = false
) {

  if (!tracks.length)
    return;

  if (index < 0)
    index = tracks.length - 1;

  if (index >= tracks.length)
    index = 0;

  const track = tracks[index];

  if (!widgetReady[index])
    return;

  if (
    currentTrack &&
    currentTrack !== track
  ) {
    resetTrack(currentTrack);
  }

  updatePlayer(track, index);

  if (autoplay)
    widgets[index].play();
}



function toggleTrack(track) {

  const index =
    tracks.indexOf(track);

  if (!widgetReady[index])
    return;

  if (currentTrack !== track) {

    loadTrack(index, true);

    return;
  }

  widgets[index].isPaused(
    paused => {

      if (paused)
        widgets[index].play();

      else
        widgets[index].pause();

    }
  );
}



function renderTracks(items) {

  tracklist.innerHTML = "";

  if (!items.length) {

    tracklist.innerHTML =
      '<div style="padding:20px 0;">' +
      'No public tracks found.' +
      '</div>';

    return;
  }


  items.forEach((item, index) => {

    const article =
      document.createElement("article");

    article.className = "track";

    article.dataset.soundcloud =
      item.permalink_url ||
      item.url ||
      "";


    article.innerHTML = `

      <div class="track-main">

        <button
          class="track-play"
          aria-label="Play track ${index + 1}"
          type="button">

          <span
            class="play-icon"
            aria-hidden="true">
          </span>

        </button>


        <div class="track-controls">

          <div class="track-progress">

            <div
              class="track-progress-fill">
            </div>

          </div>


          <span class="track-duration">
            —
          </span>

        </div>


        <div class="track-info">

          <div class="track-title">

            <span class="track-name">
            </span>

          </div>

          <div class="track-release">
            ${formatReleaseDate(
              item.created_at ||
              item.release_date
            )}
          </div>

        </div>

      </div>


      <div
        class="soundcloud-host"
        aria-hidden="true">
      </div>

    `;


    article
      .querySelector(".track-name")
      .textContent =
      item.title || "Untitled";


    tracklist.appendChild(article);

  });


  tracks =
    [...document.querySelectorAll(".track")];

  widgets =
    new Array(tracks.length);

  widgetReady =
    new Array(tracks.length)
      .fill(false);

  durations =
    items.map(
      item => Number(item.duration) || 0
    );


  initializeWidgets(items);
}



function initializeWidgets(items) {

  tracks.forEach(
    (track, index) => {

      const button =
        track.querySelector(
          ".track-play"
        );

      const progress =
        track.querySelector(
          ".track-progress"
        );

      const url =
        track.dataset.soundcloud
          .trim();

      const host =
        track.querySelector(
          ".soundcloud-host"
        );


      if (!url) {

        button.disabled = true;

        return;
      }


      const iframe =
        document.createElement("iframe");

      iframe.setAttribute(
        "scrolling",
        "no"
      );

      iframe.setAttribute(
        "frameborder",
        "no"
      );

      iframe.setAttribute(
        "allow",
        "autoplay"
      );


      iframe.src =
        `https://w.soundcloud.com/player/?url=${
          encodeURIComponent(url)
        }&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false`;


      host.appendChild(iframe);


      const widget =
        SC.Widget(iframe);

      widgets[index] =
        widget;


      widget.bind(
        SC.Widget.Events.READY,
        () => {

          widgetReady[index] =
            true;


          widget.getDuration(
            ms => {

              durations[index] =
                ms ||
                durations[index] ||
                0;


              track.querySelector(
                ".track-duration"
              ).textContent =
                formatTime(
                  durations[index]
                );


              if (track === currentTrack)

                totalTime.textContent =
                  formatTime(
                    durations[index]
                  );

            }
          );


          widget.getCurrentSound(
            sound => {

              if (!sound)
                return;


              const name =
                sound.title ||
                items[index].title ||
                "Untitled";


              track.querySelector(
                ".track-name"
              ).textContent =
                name;


              if (track === currentTrack)

                playerTitle.textContent =
                  name;

            }
          );

        }
      );


      widget.bind(
        SC.Widget.Events.PLAY,
        () => {

          if (
            currentTrack &&
            currentTrack !== track
          ) {

            resetTrack(
              currentTrack
            );

          }


          currentTrack =
            track;

          currentIndex =
            index;


          track.classList.add(
            "playing"
          );


          track.querySelector(
            ".play-icon"
          ).className =
            "play-icon is-playing";


          mainPlay.classList.add(
            "is-playing"
          );


          playerNumber.textContent =
            String(index + 1)
              .padStart(2, "0");


          playerTitle.textContent =
            track.querySelector(
              ".track-name"
            ).textContent;


          totalTime.textContent =
            formatTime(
              durations[index]
            );

        }
      );


      widget.bind(
        SC.Widget.Events.PAUSE,
        () => {

          track.classList.remove(
            "playing"
          );


          track.querySelector(
            ".play-icon"
          ).className =
            "play-icon";


          if (track === currentTrack)

            mainPlay.classList.remove(
              "is-playing"
            );

        }
      );


      widget.bind(
        SC.Widget.Events.PLAY_PROGRESS,
        data => {

          const duration =
            durations[index] || 0;


          const percent =
            duration
              ? (
                  data.currentPosition /
                  duration
                ) * 100
              : 0;


          setProgress(
            track,
            percent
          );


          if (
            track === currentTrack
          ) {

            currentTime.textContent =
              formatTime(
                data.currentPosition
              );


            playerProgressFill.style.width =
              `${percent}%`;

          }

        }
      );


      widget.bind(
        SC.Widget.Events.FINISH,
        () => {

          resetTrack(track);

          mainPlay.classList.remove(
            "is-playing"
          );

          playerProgressFill.style.width =
            "0%";


          if (
            index <
            tracks.length - 1
          ) {

            loadTrack(
              index + 1,
              true
            );

          } else {

            currentTime.textContent =
              "0:00";

          }

        }
      );


      button.addEventListener(
        "click",
        () => toggleTrack(track)
      );


      progress.addEventListener(
        "click",
        event => {

          if (
            !widgetReady[index] ||
            !durations[index]
          )

            return;


          if (
            currentTrack !== track
          )

            loadTrack(index);


          const rect =
            progress.getBoundingClientRect();


          const percent =
            Math.max(
              0,
              Math.min(
                1,
                (
                  event.clientX -
                  rect.left
                ) / rect.width
              )
            );


          widgets[index].seekTo(
            percent *
            durations[index]
          );

        }
      );

    }
  );
}



mainPlay.addEventListener(
  "click",
  () => {

    if (!currentTrack)
      return loadTrack(0, true);

    if (!widgetReady[currentIndex])
      return;


    widgets[currentIndex].isPaused(
      paused => {

        if (paused)
          widgets[currentIndex].play();

        else
          widgets[currentIndex].pause();

      }
    );

  }
);



prev.addEventListener(
  "click",
  () => {

    if (!currentTrack)
      return loadTrack(0);

    loadTrack(
      currentIndex - 1,
      true
    );

  }
);



next.addEventListener(
  "click",
  () => {

    if (!currentTrack)
      return loadTrack(0);

    loadTrack(
      currentIndex + 1,
      true
    );

  }
);



playerProgress.addEventListener(
  "click",
  event => {

    if (
      !currentTrack ||
      !durations[currentIndex] ||
      !widgetReady[currentIndex]
    )

      return;


    const rect =
      playerProgress.getBoundingClientRect();


    const percent =
      Math.max(
        0,
        Math.min(
          1,
          (
            event.clientX -
            rect.left
          ) / rect.width
        )
      );


    widgets[currentIndex].seekTo(
      percent *
      durations[currentIndex]
    );

  }
);



playerProgress.addEventListener(
  "keydown",
  event => {

    if (
      !currentTrack ||
      !durations[currentIndex] ||
      !widgetReady[currentIndex]
    )

      return;


    if (
      event.key !== "ArrowLeft" &&
      event.key !== "ArrowRight"
    )

      return;


    event.preventDefault();


    widgets[currentIndex].getPosition(
      position => {

        const amount =
          event.key === "ArrowLeft"
            ? -5000
            : 5000;


        widgets[currentIndex].seekTo(
          Math.max(
            0,
            Math.min(
              durations[currentIndex],
              position + amount
            )
          )
        );

      }
    );

  }
);



async function loadSoundCloudMirror() {

  try {

    const response =
      await fetch(
        `${DATA_URL}?v=${Date.now()}`,
        {
          cache: "no-store"
        }
      );


    if (!response.ok)

      throw new Error(
        `Could not load ${DATA_URL}`
      );


    const data =
      await response.json();


    const items =
      Array.isArray(data)
        ? data
        : (data.tracks || []);


    renderTracks(items);

  }

  catch (error) {

    console.error(error);


    tracklist.innerHTML = `

      <div style="padding:20px 0;">

        Music is temporarily unavailable.

      </div>

    `;

  }

}



loadSoundCloudMirror();

</script>

</body>
</html>
