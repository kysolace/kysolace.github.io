<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <title>kysolace — Music</title>

  <link rel="stylesheet" href="audio-style.css">
  <script src="https://w.soundcloud.com/player/api.js"></script>
</head>

<body>

  <header class="site-header">
    <nav>
      <a href="index.html">kysolace</a>
      <a href="music.html" class="active">Music</a>
      <a href="archive.html">Archive</a>
      <a href="ideas.html">Ideas</a>
    </nav>
  </header>

  <main class="audio-page">
    <section class="project">
      <div class="tracklist" id="tracklist" aria-live="polite"></div>
    </section>
  </main>

  <div class="player">
    <div class="player-inner">
      <div class="player-track">
        <span class="player-number" id="player-number">01</span>
        <div class="player-title" id="player-title">—</div>
      </div>

      <div class="player-controls">
        <button id="prev" type="button" aria-label="Previous track">‹</button>
        <button id="main-play" class="main-play" type="button" aria-label="Play"><span class="play-symbol" aria-hidden="true"></span></button>
        <button id="next" type="button" aria-label="Next track">›</button>
      </div>

      <div class="player-time">
        <span id="current-time">0:00</span>
        <div class="player-progress" id="player-progress" role="slider" aria-label="Seek" tabindex="0">
          <div class="player-progress-fill" id="player-progress-fill"></div>
        </div>
        <span id="total-time">0:00</span>
      </div>
    </div>
  </div>

  <script>
    /*
      Automatic SoundCloud mirror
      ----------------------------
      This page does NOT contain individual track links.
      GitHub Actions should generate soundcloud-tracks.json from your
      public SoundCloud profile. This page then renders that file.

      Expected JSON:
      {
        "tracks": [
          {
            "title": "Track name",
            "permalink_url": "https://soundcloud.com/kysolace/example",
            "artwork_url": "https://...",
            "duration": 123456,
            "created_at": "2026-09-10T..."
          }
        ]
      }
    */

    const DATA_URL = "soundcloud-tracks.json";

    const tracklist = document.getElementById("tracklist");
    const mainPlay = document.getElementById("main-play");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const playerNumber = document.getElementById("player-number");
    const playerTitle = document.getElementById("player-title");
    const currentTime = document.getElementById("current-time");
    const totalTime = document.getElementById("total-time");
    const playerProgress = document.getElementById("player-progress");
    const playerProgressFill = document.getElementById("player-progress-fill");

    let tracks = [];
    let widgets = [];
    let widgetReady = [];
    let durations = [];
    let currentTrack = null;
    let currentIndex = -1;

    function formatTime(ms) {
      if (!Number.isFinite(ms) || ms <= 0) return "—";
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function formatReleaseDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const year = String(date.getFullYear()).slice(-2);
      return `${month}.${day}.${year}`;
    }

    function setProgress(track, percent) {
      const fill = track.querySelector(".track-progress-fill");
      if (fill) fill.style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    function resetTrack(track) {
      if (!track) return;
      track.classList.remove("playing");
      const icon = track.querySelector(".play-icon");
      if (icon) icon.className = "play-icon";
      setProgress(track, 0);
    }

    function updatePlayer(track, index) {
      currentTrack = track;
      currentIndex = index;
      playerNumber.textContent = String(index + 1).padStart(2, "0");
      playerTitle.textContent = track.querySelector(".track-name")?.textContent || "—";
      currentTime.textContent = "0:00";
      totalTime.textContent = formatTime(durations[index]);
      playerProgressFill.style.width = "0%";
    }

    function loadTrack(index, autoplay = false) {
      if (!tracks.length) return;
      if (index < 0) index = tracks.length - 1;
      if (index >= tracks.length) index = 0;

      const track = tracks[index];
      if (!widgetReady[index]) return;

      if (currentTrack && currentTrack !== track) resetTrack(currentTrack);
      updatePlayer(track, index);

      if (autoplay) widgets[index].play();
    }

    function toggleTrack(track) {
      const index = tracks.indexOf(track);
      if (!widgetReady[index]) return;

      if (currentTrack !== track) {
        loadTrack(index, true);
        return;
      }

      widgets[index].isPaused(paused => {
        if (paused) widgets[index].play();
        else widgets[index].pause();
      });
    }

    function renderTracks(items) {
      tracklist.innerHTML = "";

      if (!items.length) {
        tracklist.innerHTML = '<div style="padding:20px 0;">No public tracks found.</div>';
        return;
      }

      items.forEach((item, index) => {
        const article = document.createElement("article");
        article.className = "track";
        article.dataset.soundcloud = item.permalink_url || item.url || "";

        article.innerHTML = `
          <button class="track-play" aria-label="Play track ${index + 1}" type="button">
            <span class="play-icon" aria-hidden="true"></span>
          </button>

          <div class="track-main">
            <div class="track-title">
              <span class="track-artwork" aria-hidden="true"></span>
              <span class="track-name"></span>
            </div>
            <div class="track-progress">
              <div class="track-progress-fill"></div>
            </div>
          </div>

          <span class="track-duration">—</span>
          <span class="track-release">${formatReleaseDate(item.created_at || item.release_date)}</span>
          <div class="soundcloud-host" aria-hidden="true"></div>
        `;

        article.querySelector(".track-name").textContent = item.title || "Untitled";

        if (item.artwork_url) {
          const artwork = article.querySelector(".track-artwork");
          artwork.style.backgroundImage = `url("${item.artwork_url}")`;
          artwork.classList.add("has-image");
        }

        tracklist.appendChild(article);
      });

      tracks = [...document.querySelectorAll(".track")];
      widgets = new Array(tracks.length);
      widgetReady = new Array(tracks.length).fill(false);
      durations = items.map(item => Number(item.duration) || 0);

      initializeWidgets(items);
    }

    function initializeWidgets(items) {
      tracks.forEach((track, index) => {
        const button = track.querySelector(".track-play");
        const progress = track.querySelector(".track-progress");
        const url = track.dataset.soundcloud.trim();
        const host = track.querySelector(".soundcloud-host");

        if (!url) {
          button.disabled = true;
          return;
        }

        const iframe = document.createElement("iframe");
        iframe.setAttribute("scrolling", "no");
        iframe.setAttribute("frameborder", "no");
        iframe.setAttribute("allow", "autoplay");
        iframe.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false`;
        host.appendChild(iframe);

        const widget = SC.Widget(iframe);
        widgets[index] = widget;

        widget.bind(SC.Widget.Events.READY, () => {
          widgetReady[index] = true;

          widget.getDuration(ms => {
            durations[index] = ms || durations[index] || 0;
            track.querySelector(".track-duration").textContent = formatTime(durations[index]);
            if (track === currentTrack) totalTime.textContent = formatTime(durations[index]);
          });

          widget.getCurrentSound(sound => {
            if (!sound) return;
            const name = sound.title || items[index].title || "Untitled";
            track.querySelector(".track-name").textContent = name;
            if (track === currentTrack) playerTitle.textContent = name;

            if (!track.querySelector(".track-artwork").classList.contains("has-image")) {
              const artworkUrl = sound.artwork_url || sound.user?.avatar_url || "";
              if (artworkUrl) {
                const artwork = track.querySelector(".track-artwork");
                artwork.style.backgroundImage = `url("${artworkUrl}")`;
                artwork.classList.add("has-image");
              }
            }
          });
        });

        widget.bind(SC.Widget.Events.PLAY, () => {
          if (currentTrack && currentTrack !== track) resetTrack(currentTrack);
          currentTrack = track;
          currentIndex = index;
          track.classList.add("playing");
          track.querySelector(".play-icon").className = "play-icon is-playing";
          mainPlay.classList.add("is-playing");
          playerNumber.textContent = String(index + 1).padStart(2, "0");
          playerTitle.textContent = track.querySelector(".track-name").textContent;
          totalTime.textContent = formatTime(durations[index]);
        });

        widget.bind(SC.Widget.Events.PAUSE, () => {
          track.classList.remove("playing");
          track.querySelector(".play-icon").className = "play-icon";
          if (track === currentTrack) mainPlay.classList.remove("is-playing");
        });

        widget.bind(SC.Widget.Events.PLAY_PROGRESS, data => {
          const duration = durations[index] || 0;
          const percent = duration ? (data.currentPosition / duration) * 100 : 0;
          setProgress(track, percent);

          if (track === currentTrack) {
            currentTime.textContent = formatTime(data.currentPosition);
            playerProgressFill.style.width = `${percent}%`;
          }
        });

        widget.bind(SC.Widget.Events.FINISH, () => {
          resetTrack(track);
          mainPlay.classList.remove("is-playing");
          playerProgressFill.style.width = "0%";

          if (index < tracks.length - 1) {
            loadTrack(index + 1, true);
          } else {
            currentTime.textContent = "0:00";
          }
        });

        button.addEventListener("click", () => toggleTrack(track));

        progress.addEventListener("click", event => {
          if (!widgetReady[index] || !durations[index]) return;
          if (currentTrack !== track) loadTrack(index);

          const rect = progress.getBoundingClientRect();
          const percent = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
          widgets[index].seekTo(percent * durations[index]);
        });
      });
    }

    mainPlay.addEventListener("click", () => {
      if (!currentTrack) return loadTrack(0, true);
      if (!widgetReady[currentIndex]) return;

      widgets[currentIndex].isPaused(paused => {
        if (paused) widgets[currentIndex].play();
        else widgets[currentIndex].pause();
      });
    });

    prev.addEventListener("click", () => {
      if (!currentTrack) return loadTrack(0);
      loadTrack(currentIndex - 1, true);
    });

    next.addEventListener("click", () => {
      if (!currentTrack) return loadTrack(0);
      loadTrack(currentIndex + 1, true);
    });

    playerProgress.addEventListener("click", event => {
      if (!currentTrack || !durations[currentIndex] || !widgetReady[currentIndex]) return;

      const rect = playerProgress.getBoundingClientRect();
      const percent = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      widgets[currentIndex].seekTo(percent * durations[currentIndex]);
    });

    playerProgress.addEventListener("keydown", event => {
      if (!currentTrack || !durations[currentIndex] || !widgetReady[currentIndex]) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;

      event.preventDefault();
      widgets[currentIndex].getPosition(position => {
        const amount = event.key === "ArrowLeft" ? -5000 : 5000;
        widgets[currentIndex].seekTo(Math.max(0, Math.min(durations[currentIndex], position + amount)));
      });
    });

    async function loadSoundCloudMirror() {
      try {
        const response = await fetch(`${DATA_URL}?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Could not load ${DATA_URL}`);

        const data = await response.json();
        const items = Array.isArray(data) ? data : (data.tracks || []);
        renderTracks(items);
      } catch (error) {
        console.error(error);
        tracklist.innerHTML = `
          <div style="padding:20px 0;">
            Music is temporarily unavailable.
          </div>
        `;
      }
    }

    loadSoundCloudMirror();
  </script>

</body>
</html>
